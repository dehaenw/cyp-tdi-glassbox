name: cyp-glassbox
channels: [conda-forge]
dependencies:
  - python=3.12
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - rdkit>=2023.9
  - pyarrow          # parquet, for the submission format
  - jupyter
  - nbformat
  - matplotlib
  - pip
  - pip:
    # Optional: both blocks' matrices are shipped in features/. These are needed
    # only to RECOMPUTE them. Note the distribution name for CASPER -- the
    # module is `casper`, and `pip install casper` is an unrelated project.
    - casper-descriptor>=0.1
    - mordred>=1.2
