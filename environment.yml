name: cyp-glassbox
channels: [conda-forge]
dependencies:
  - python=3.12
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - rdkit>=2023.9
  - pyarrow          # parquet, for the submission format
  - jupyter
  - nbformat
  - matplotlib
  - pip
  - pip:
    - mordred>=1.2   # optional: only to rebuild the full 2D matrix
