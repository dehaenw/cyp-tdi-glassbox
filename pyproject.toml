[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cyp-tdi-glassbox"
version = "1.0.0"
description = "A natively interpretable linear model for CYP time-dependent inhibition"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Wim Dehaen"}]
keywords = ["cheminformatics", "cytochrome-p450", "interpretability", "ADMET"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "rdkit>=2023.9",
]

[project.optional-dependencies]
# The 3D block. NOTE the distribution name: the module is `casper`, the package
# is `casper-descriptor`, and `pip install casper` is an unrelated project.
# Needed only to RECOMPUTE the 3D features or render surface patches -- the
# matrices themselves are shipped in features/.
casper = ["casper-descriptor>=0.1"]
# The 2D block. Needed only to rebuild the full matrix, since the columns the
# fitted models use are shipped.
mordred = ["mordred>=1.2"]
notebook = ["jupyter", "nbformat", "matplotlib"]
all = ["casper-descriptor>=0.1", "mordred>=1.2", "jupyter", "nbformat", "matplotlib"]

[project.urls]
Homepage = "https://github.com/dehaenw/cyp-tdi-glassbox"
"CASPER (3D descriptors)" = "https://github.com/dehaenw/casper"

[tool.setuptools]
packages = ["glassbox"]
